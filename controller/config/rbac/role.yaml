---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - ""
  resources:
  - nodes
  - secrets
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - admissionregistration.k8s.io
  resources:
  - mutatingwebhookconfigurations
  - validatingwebhookconfigurations
  verbs:
  - create
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - juneau.loutres.me
  resources:
  - subnets
  - vpcs
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - juneau.loutres.me
  resources:
  - subnets/finalizers
  - vpcs/finalizers
  verbs:
  - update
- apiGroups:
  - juneau.loutres.me
  resources:
  - subnets/status
  - vpcs/status
  verbs:
  - get
  - patch
  - update
