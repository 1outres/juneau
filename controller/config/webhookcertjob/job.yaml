apiVersion: batch/v1
kind: Job
metadata:
  name: webhook-cert-bootstrap
  labels:
    app.kubernetes.io/name: webhook-cert-job
    app.kubernetes.io/component: bootstrap
    app.kubernetes.io/part-of: juneau
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      labels:
        app.kubernetes.io/name: webhook-cert-job
        app.kubernetes.io/component: bootstrap
        app.kubernetes.io/part-of: juneau
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      serviceAccountName: webhook-cert-issuer
      restartPolicy: OnFailure
      containers:
        - name: webhook-cert-job
          image: example.com/webhookcertjob:v0.0.1
          imagePullPolicy: IfNotPresent
          command:
            - /webhookcertjob
          args:
            - --secret-name=webhook-certs
            - --ca-secret-name=webhook-ca
            - --namespace=$(POD_NAMESPACE)
            - --common-name=webhook-server
            - --renew-before-days=30
            - --server-valid-days=90
            - --ca-valid-years=10
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
