---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.17.2
  name: subnets.juneau.loutres.me
spec:
  group: juneau.loutres.me
  names:
    kind: Subnet
    listKind: SubnetList
    plural: subnets
    singular: subnet
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.vpc
      name: Vpc
      type: string
    - jsonPath: .spec.cidr
      name: Cidr
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Subnet is the Schema for the subnets API.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: SubnetSpec defines the desired state of Subnet.
            properties:
              cidr:
                type: string
              networkACL:
                description: |-
                  NetworkACL names the NetworkACL applied at this Subnet's
                  boundary. The referenced ACL must belong to the same Vpc as the
                  Subnet (webhook-enforced). Empty means "no ACL" — the Subnet
                  boundary does not enforce policy and traffic flows straight to
                  the per-Pod SecurityGroup layer.

                  Mutability: the field is mutable. Switching the reference (or
                  clearing it) re-converges the Subnet status and triggers
                  daemon-side CT invalidation so flows pick up the new policy on
                  their next packet.
                type: string
              routeTable:
                description: |-
                  RouteTable selects which RouteTable governs traffic from Pods in
                  this Subnet. Empty means "use the owning Vpc's main RouteTable",
                  which preserves the original behaviour. The referenced RouteTable
                  must belong to the same Vpc.
                type: string
              vpc:
                type: string
            required:
            - cidr
            - vpc
            type: object
          status:
            description: SubnetStatus defines the observed state of Subnet.
            properties:
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              dns:
                description: |-
                  DNS is the per-Subnet virtual DNS resolver IP (the second usable
                  address in the prefix, conventionally `.2`). The juneau daemon
                  terminates UDP/53 and TCP/53 destined for this address inside its
                  virtual service plane and never bridges it to the underlay. Empty
                  when the Subnet's prefix has no usable `.2`.
                type: string
              dnsMAC:
                description: |-
                  DNSMAC is the locally-administered Ethernet address that ARP for
                  the DNS VIP resolves to. Distinct from GatewayMAC so the data
                  plane can demultiplex virtual-service traffic by destination MAC
                  before consulting the FIB. Empty when DNS is empty.
                type: string
              gateway:
                type: string
              gatewayMAC:
                type: string
              networkACL:
                description: |-
                  NetworkACL mirrors the resolved spec.networkACL reference. It
                  carries the cluster-wide ACLID the daemon writes into the BPF
                  subnet_map plus the ACL's RulesetVersion at the time the
                  reference was resolved. Empty (nil) when spec.networkACL is
                  unset or the named ACL does not yet exist.
                properties:
                  aclID:
                    description: |-
                      ACLID is the resolved cluster-wide identifier from the
                      referenced NetworkACL's status.aclID. Zero means "the ACL
                      exists in spec but has not been allocated yet"; the daemon
                      treats zero as "no ACL programmed" and falls back to default-allow
                      until the controller publishes a non-zero value.
                    format: int32
                    type: integer
                  name:
                    description: |-
                      Name mirrors spec.networkACL — the user-facing reference. Kept
                      in status so daemons consume one struct without cross-checking
                      spec.
                    type: string
                  rulesetVersion:
                    description: |-
                      RulesetVersion mirrors the referenced ACL's
                      status.rulesetVersion at the moment the reference was resolved.
                      Daemons compare this against their last-applied value to decide
                      whether to flush CT entries.
                    format: int64
                    type: integer
                required:
                - name
                type: object
              observedGeneration:
                format: int64
                type: integer
              vni:
                format: int32
                type: integer
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
