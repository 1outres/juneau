  annotations:
    controller-gen.kubebuilder.io/version: v0.17.2
  name: allocationclaims.juneau.loutres.me
spec:
  group: juneau.loutres.me
  names:
    kind: AllocationClaim
    listKind: AllocationClaimList
    plural: allocationclaims
    singular: allocationclaim
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.value.number
      name: Number
      type: integer
    - jsonPath: .status.value.ip
      name: IP
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: AllocationClaim is the Schema for the allocationclaims API.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: AllocationClaimSpec defines the desired state of AllocationClaim.
            properties:
              allocationFilter:
                description: |-
                  AllocationFilter restricts the candidate space inside the pools. Used
                  when a consumer wants to take from a specific subset of CIDRs.
                properties:
                  cidrs:
                    description: |-
                      CIDRs further narrow the candidate address space inside ip-typed
                      pools. Each entry must be a subset of one of the pool CIDRs.
                    items:
                      type: string
                    type: array
                    x-kubernetes-list-type: set
                type: object
              attribute:
                description: |-
                  Attribute identifies the target field on the owning resource, for example
                  status.vni or status.tableID.
                minLength: 1
                type: string
              dns:
                description: |-
                  DNS associates names with an allocated IP for one Vpc. Allocation
                  consumers populate this optional infrastructure-level binding; the
                  allocation controller copies it to the lease that owns the address.
                properties:
                  names:
                    items:
                      type: string
                    minItems: 1
                    type: array
                    x-kubernetes-list-type: set
                  vpc:
                    minLength: 1
                    type: string
                required:
                - names
                - vpc
                type: object
              poolRefs:
                description: |-
                  PoolRefs lists candidate pools, evaluated in order. The first pool
                  that has a free value satisfying the claim wins.
                items:
                  properties:
                    name:
                      minLength: 1
                      type: string
                  required:
                  - name
                  type: object
                minItems: 1
                type: array
              releaseAfter:
                description: |-
                  ReleaseAfter specifies how long the AllocationLease should outlive
                  this claim. While the lease is alive, no other claim can take the
                  same value, and a re-created claim with the same identity will
                  inherit the same value. When unset, the lease is deleted immediately
                  alongside the claim.
                type: string
              requestedIP:
                description: |-
                  RequestedIP pins a specific value for ip-typed pools. Must be a valid
                  IPv4/IPv6 string and must fall inside one of the candidate pools'
                  CIDRs (further restricted by AllocationFilter when set).
                type: string
              requestedNumber:
                description: RequestedNumber pins a specific value for number-typed
                  pools.
                format: int64
                minimum: 1
                type: integer
              resourceRef:
                properties:
                  apiVersion:
                    minLength: 1
                    type: string
                  kind:
                    minLength: 1
                    type: string
                  name:
                    minLength: 1
                    type: string
                  namespace:
                    description: |-
                      Namespace of the referenced resource. Required when the owner is a
                      namespaced resource; omit for cluster-scoped owners.
                    type: string
                required:
                - apiVersion
                - kind
                - name
                type: object
              retainWhile:
                description: |-
                  RetainWhile keeps the AllocationLease alive for as long as the
                  referenced object exists. ReleaseAfter is then counted from the
                  moment that object disappears rather than from the deletion of this
                  claim. The value is copied onto the lease.
                properties:
                  apiVersion:
                    minLength: 1
                    type: string
                  kind:
                    minLength: 1
                    type: string
                  name:
                    minLength: 1
                    type: string
                  namespace:
                    description: Namespace of the referenced object. Empty for cluster
                      scoped kinds.
                    type: string
                required:
                - apiVersion
                - kind
                - name
                type: object
              reuseKey:
                description: |-
                  ReuseKey is the stable identity used to find an existing
                  AllocationLease. Claims that share a ReuseKey inherit the same value
                  across recreations, even when their own names differ. When empty the
                  claim name is used, so owners with a stable name keep working without
                  setting it. Must be a DNS-1123 subdomain because it names the lease.
                type: string
            required:
            - attribute
            - poolRefs
            - resourceRef
            type: object
          status:
            description: AllocationClaimStatus defines the observed state of AllocationClaim.
            properties:
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              observedGeneration:
                format: int64
                type: integer
              phase:
                type: string
              value:
                properties:
                  ip:
                    type: string
                  number:
                    format: int64
                    type: integer
                type: object
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
