kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.17.2
  name: routetables.juneau.loutres.me
spec:
  group: juneau.loutres.me
  names:
    kind: RouteTable
    listKind: RouteTableList
    plural: routetables
    singular: routetable
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: RouteTable is the Schema for the routetables API.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: RouteTableSpec defines the desired state of RouteTable.
            properties:
              routes:
                items:
                  description: Route is one entry of spec.routes.
                  properties:
                    dst:
                      minLength: 1
                      type: string
                    via:
                      properties:
                        endpoint:
                          description: |-
                            Endpoint is required when type=endpoint. It names one NIC of a
                            workload, not one Pod, so the route follows the workload when a
                            new Pod replaces the old one.
                          properties:
                            allocationIdentity:
                              description: |-
                                AllocationIdentity is the NetworkInterface.spec.allocationIdentity
                                of the workload. A Pod sets it with the
                                juneau.loutres.me/allocation-identity annotation.
                              minLength: 1
                              type: string
                            interface:
                              description: Interface is the name of the NIC inside
                                the Pod, such as eth0.
                              minLength: 1
                              type: string
                            namespace:
                              description: Namespace is the namespace of the workload's
                                Pods.
                              minLength: 1
                              type: string
                          required:
                          - allocationIdentity
                          - interface
                          - namespace
                          type: object
                        natGateway:
                          description: |-
                            NATGateway is required when type=natGateway. Refers to a
                            NATGateway by name (cluster-scoped).
                          type: string
                        transitGateway:
                          description: |-
                            TransitGateway is required when type=transitGateway. Refers to a
                            TransitGateway by name (cluster-scoped).
                          type: string
                        type:
                          enum:
                          - connected
                          - endpoint
                          - internetGateway
                          - service
                          - natGateway
                          - vpcPeering
                          - transitGateway
                          - vpcEndpoint
                          - blackhole
                          type: string
                        vpcPeering:
                          description: |-
                            VpcPeering is required when type=vpcPeering. Refers to a
                            VpcPeering by name (cluster-scoped).
                          type: string
                      required:
                      - type
                      type: object
                  required:
                  - dst
                  - via
                  type: object
                type: array
              vpc:
                minLength: 1
                type: string
            required:
            - vpc
            type: object
          status:
            description: RouteTableStatus defines the observed state of RouteTable.
            properties:
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              observedGeneration:
                format: int64
                type: integer
              routes:
                description: |-
                  Routes is the table the data plane programs: the routes the
                  controller adds on its own for the Vpc, followed by spec.routes
                  with their references resolved.
                items:
                  description: ResolvedRoute is one entry of the table the data plane
                    programs.
                  properties:
                    dst:
                      type: string
                    l2Network:
                      description: |-
                        L2Network names the segment a connected route leads to when the
                        destination is an L2Network rather than a Subnet. The data plane
                        hands the packet to the gateway port of that segment, and the
                        segment forwards it from there on its own tables.
                      type: string
                    message:
                      description: |-
                        Message says why the controller drops traffic that spec.routes
                        asked it to forward. It is empty on every other route.
                      type: string
                    networkEndpoint:
                      description: |-
                        NetworkEndpoint is the NetworkEndpoint via.endpoint resolved to.
                        It is set only on an Active endpoint route.
                      properties:
                        name:
                          minLength: 1
                          type: string
                        namespace:
                          minLength: 1
                          type: string
                      required:
                      - name
                      - namespace
                      type: object
                    state:
                      description: |-
                        State tells whether the data plane forwards traffic for Dst
                        (Active) or drops it (Blackhole).
                      enum:
                      - Active
                      - Blackhole
                      type: string
                    subnet:
                      description: |-
                        Subnet is the Subnet the data plane forwards the packet into: the
                        Subnet of a connected route, the peer Subnet of a vpcPeering
                        route, or the Subnet of the endpoint of an endpoint route.
                      type: string
                    transitGatewayRouteTable:
                      description: |-
                        TransitGatewayRouteTable names the TransitGatewayRouteTable the
                        data plane consults for this route. The controller resolves it
                        from the attachment's association.
                      type: string
                    via:
                      properties:
                        endpoint:
                          description: |-
                            Endpoint is required when type=endpoint. It names one NIC of a
                            workload, not one Pod, so the route follows the workload when a
                            new Pod replaces the old one.
                          properties:
