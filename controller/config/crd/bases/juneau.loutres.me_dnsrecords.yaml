                description: |-
                  Addresses is the deduplicated set of resolved IPv4 addresses. An empty set
                  is valid. A record can contain at most 100 addresses.
                items:
                  type: string
                maxItems: 100
                type: array
                x-kubernetes-list-type: set
              conditions:
                description: |-
