        description: VpcPeering is the Schema for the vpcpeerings API.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              VpcPeeringSpec defines the desired state of VpcPeering.

              A VpcPeering connects two Vpcs so that a RouteTable in either one may
              carry a route with via.type=vpcPeering towards a Subnet of the other.
              The peering itself installs no route: every prefix that should be
              reachable has to be written into a RouteTable explicitly.

              Requester and Accepter name the two sides. Juneau has no accept
              workflow — both Vpcs live in the same cluster under one administrator
              — so the two fields only fix a stable order for status messages and
              keep the vocabulary close to AWS VPC peering.
            properties:
              accepter:
                description: Accepter is the other side of the peering. Immutable.
                properties:
                  vpc:
                    description: Vpc names the Vpc on this side of the peering.
                    minLength: 1
                    type: string
                required:
                - vpc
                type: object
              requester:
                description: Requester is one side of the peering. Immutable.
                properties:
                  vpc:
                    description: Vpc names the Vpc on this side of the peering.
                    minLength: 1
                    type: string
                required:
                - vpc
                type: object
            required:
            - accepter
            - requester
            type: object
          status:
            description: VpcPeeringStatus defines the observed state of VpcPeering.
            properties:
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
