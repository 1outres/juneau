  names:
    kind: AllocationLease
    listKind: AllocationLeaseList
    plural: allocationleases
    singular: allocationlease
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.poolRef.name
      name: Pool
      type: string
    - jsonPath: .spec.claimRef.name
      name: Claim
      type: string
    - jsonPath: .spec.value.number
      name: Number
      type: integer
    - jsonPath: .spec.value.ip
      name: IP
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.expiresAt
      name: ExpiresAt
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: AllocationLease is the Schema for the allocationleases API.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              AllocationLeaseSpec defines the desired state of AllocationLease.

              AllocationLease records a single (pool, value) reservation that survives
              the deletion of its owning AllocationClaim. The lease is named after the
              claim's reuse key, so a claim re-created under that key inherits the
              recorded value. Leases are managed entirely by the AllocationClaim
              controller; consumers of the allocation framework should never create or
              modify AllocationLease objects directly.
            properties:
              claimRef:
                description: |-
                  ClaimRef identifies the AllocationClaim that currently holds this
                  lease. It changes when a released lease is handed over to another
                  claim that shares the same reuse key.

                  Leases stored before this field existed read back with an empty
                  holder. The schema therefore accepts one, while admission rejects
                  it, so the controller can adopt those leases on the next reconcile
                  but can never write a lease without a holder itself.
                properties:
                  name:
                    type: string
                  uid:
                    type: string
                type: object
              dns:
                description: DNS is the Vpc-scoped name binding retained with this
                  IP reservation.
                properties:
                  names:
                    items:
                      type: string
                    minItems: 1
                    type: array
                    x-kubernetes-list-type: set
                  vpc:
                    minLength: 1
                    type: string
                required:
                - names
                - vpc
                type: object
              ownerDeletionTimestamp:
                description: |-
                  OwnerDeletionTimestamp records when the owning AllocationClaim was
                  deleted. While unset, the lease is considered Active and will not be
                  reaped. Once set, the lease is treated as Released and the controller
                  will delete it after TTLSeconds elapses.
                format: date-time
                type: string
              poolRef:
                description: |-
                  PoolRef references the AllocationPool that owns this lease via
                  metadata.ownerReferences. The pool name is also kept here for
                  efficient field-indexed lookups.
                properties:
                  name:
                    minLength: 1
                    type: string
                required:
                - name
                type: object
              retainWhile:
                description: |-
                  RetainWhile holds the reservation for as long as the referenced
                  object exists. While it is there the lease stays Retained and the
                  TTL does not run; the countdown starts from
                  Status.RetainReleasedAt instead of OwnerDeletionTimestamp. Unlike
                  the rest of the identity fields this one is mutable, because a new
                  claim generation may point the same lease at a different object.
                properties:
                  apiVersion:
                    minLength: 1
                    type: string
                  kind:
                    minLength: 1
                    type: string
                  name:
                    minLength: 1
                    type: string
                  namespace:
                    description: Namespace of the referenced object. Empty for cluster
                      scoped kinds.
                    type: string
                required:
                - apiVersion
                - kind
                - name
                type: object
              ttlSeconds:
                description: |-
                  TTLSeconds is the grace period applied after the lease is released.
                  Copied from the originating AllocationClaim.spec.releaseAfter.
                format: int32
                minimum: 0
                type: integer
              value:
                description: Value is the reserved address or number.
                properties:
                  ip:
                    type: string
                  number:
                    format: int64
                    type: integer
                type: object
            required:
            - poolRef
            - value
            type: object
          status:
            description: AllocationLeaseStatus defines the observed state of AllocationLease.
            properties:
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              expiresAt:
                format: date-time
                type: string
              observedGeneration:
                format: int64
                type: integer
              phase:
                type: string
              retainReleasedAt:
                description: |-
                  RetainReleasedAt records when the controller first observed that
                  the object named by Spec.RetainWhile was gone. It is the start of
                  the TTL for a lease that has a retain reference, and it is cleared
                  again when the object comes back.
                format: date-time
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
