syntax = "proto3";

package echo.v1;

option go_package = "pkg/juneaupb;juneaupb";

service IPAM {
  rpc Allocate(AllocateRequest) returns (AllocateResponse);
}

message CNIIdentity {
  string node_name     = 1;
  string pod_namespace = 2;
  string pod_name      = 3;
  string container_id  = 4;
  string if_name       = 5;
  string pod_uid       = 6;
}

message AllocateRequest {
  CNIIdentity id = 1;
  string mac_address = 2;
}

message AllocateResponse {
  Error error = 1;
  IPAssignment ip_assignment = 2;
}

message IPAssignment {
  IPConfig ipv4 = 1;
}

message Error {
  string message = 2;
}

message IPConfig {
  string address_cidr  = 1;
  string gateway       = 2;
}
