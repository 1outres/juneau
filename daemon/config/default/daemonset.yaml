apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: cni-daemon
  labels:
    app: cni-daemon
spec:
  selector:
    matchLabels:
      app: cni-daemon
  template:
    metadata:
      labels:
        app: cni-daemon
    spec:
      hostNetwork: true
      hostPID: true
      dnsPolicy: ClusterFirstWithHostNet
      terminationGracePeriodSeconds: 10
      tolerations:
        - operator: "Exists"
      serviceAccountName: cni-daemon
      containers:
        - name: cni-daemon
          image: daemon:latest
          imagePullPolicy: IfNotPresent
          securityContext:
            privileged: true
          volumeMounts:
            - name: cni-bin
              mountPath: /opt/cni/bin
            - name: cni-conf
              mountPath: /etc/cni/net.d
            - name: host-var-run
              mountPath: /var/run
              mountPropagation: HostToContainer
            - name: host-sys
              mountPath: /sys
              readOnly: true
            - name: host-lib-modules
              mountPath: /lib/modules
              readOnly: true
            - name: k3s-data
              mountPath: /var/lib/rancher/k3s/data
              readOnly: true
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
      volumes:
        - name: cni-bin
          hostPath:
            path: /opt/cni/bin
            type: DirectoryOrCreate
        - name: cni-conf
          hostPath:
            path: /etc/cni/net.d
            type: DirectoryOrCreate
        - name: host-var-run
          hostPath:
            path: /var/run
            type: DirectoryOrCreate
        - name: host-sys
          hostPath:
            path: /sys
        - name: host-lib-modules
          hostPath:
            path: /lib/modules
        - name: k3s-data
          hostPath:
            path: /var/lib/rancher/k3s/data
            type: DirectoryOrCreate
