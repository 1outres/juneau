---
# TraceSession is cluster-scoped and read+status-write by the daemon's
# trace reconciler. Editor is the smallest stock role that grants
# status patch (needed for daemons to append themselves to
# status.observedNodes).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cni-daemon-tracesession-editor-binding
subjects:
  - kind: ServiceAccount
    name: cni-daemon
    namespace: kube-system
roleRef:
  kind: ClusterRole
  name: juneau-tracesession-editor-role
  apiGroup: rbac.authorization.k8s.io
---
# ServiceLoadBalancer view: the LB reconciler reads SLB resources
# (status.vip, status.advertisingNodes, ports) to program local
# backends. Read-only; the controller plane writes status.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cni-daemon-serviceloadbalancer-viewer-binding
subjects:
  - kind: ServiceAccount
    name: cni-daemon
    namespace: kube-system
roleRef:
  kind: ClusterRole
  name: juneau-serviceloadbalancer-viewer-role
  apiGroup: rbac.authorization.k8s.io
---
# Cluster Service / EndpointSlice access lets the Service reconciler
# populate service_map and backend_map for ClusterIP routing.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cni-daemon-service-viewer-role
rules:
  - apiGroups: [""]
    resources:
      - services
    verbs:
      - get
      - list
      - watch
  - apiGroups: ["discovery.k8s.io"]
    resources:
      - endpointslices
    verbs:
      - get
      - list
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cni-daemon-service-viewer-binding
subjects:
  - kind: ServiceAccount
    name: cni-daemon
    namespace: kube-system
roleRef:
  kind: ClusterRole
  name: cni-daemon-service-viewer-role
  apiGroup: rbac.authorization.k8s.io
