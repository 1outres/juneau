apiVersion: v1
kind: ServiceAccount
metadata:
  name: cni-daemon
  namespace: kube-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cni-daemon-subnet-viewer-binding
subjects:
  - kind: ServiceAccount
    name: cni-daemon
    namespace: kube-system
roleRef:
  kind: ClusterRole
  name: subnet-viewer-role
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cni-daemon-vpc-viewer-binding
subjects:
  - kind: ServiceAccount
    name: cni-daemon
    namespace: kube-system
roleRef:
  kind: ClusterRole
  name: vpc-viewer-role
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cni-daemon-subnetlease-viewer-binding
subjects:
  - kind: ServiceAccount
    name: cni-daemon
    namespace: kube-system
roleRef:
  kind: ClusterRole
  name: subnetlease-viewer-role
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cni-daemon-address-editor-binding
subjects:
  - kind: ServiceAccount
    name: cni-daemon
    namespace: kube-system
roleRef:
  kind: ClusterRole
  name: address-editor-role
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: pod-viewer
rules:
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cni-daemon-pod-viewer-binding
subjects:
  - kind: ServiceAccount
    name: cni-daemon
    namespace: kube-system
roleRef:
  kind: ClusterRole
  name: pod-viewer
  apiGroup: rbac.authorization.k8s.io
