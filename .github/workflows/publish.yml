name: Publish Images

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Image tag to publish
        required: false
        type: string

permissions:
  contents: read
  packages: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - name: Resolve publish tag
        id: meta
        run: |
          tag="${{ inputs.tag }}"
          if [ -z "$tag" ] && [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            tag="${GITHUB_REF_NAME}"
          fi
          if [ -z "$tag" ]; then
            tag="sha-${GITHUB_SHA::12}"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  publish:
    needs: prepare
    name: Publish ${{ matrix.image }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: controller
            context: controller
            dockerfile: controller/Dockerfile
            cache_scope: controller-image
            qemu: false
          - image: webhookcertjob
            context: controller
            dockerfile: controller/Dockerfile.webhookcertjob
            cache_scope: webhookcertjob-image
            qemu: false
          - image: daemon
            context: .
            dockerfile: daemon/Dockerfile
            cache_scope: daemon-image
            qemu: true
          - image: bgp-speaker
            context: .
            dockerfile: bgp-speaker/Dockerfile
            cache_scope: bgp-speaker-image
            qemu: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup QEMU
        if: matrix.qemu
        uses: docker/setup-qemu-action@v3

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ghcr.io/1outres/juneau/${{ matrix.image }}:${{ needs.prepare.outputs.tag }}
          cache-from: |
            type=registry,ref=ghcr.io/1outres/juneau/${{ matrix.image }}:buildcache
            type=gha,scope=${{ matrix.cache_scope }}
          cache-to: type=registry,ref=ghcr.io/1outres/juneau/${{ matrix.image }}:buildcache,mode=max

  release:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs:
      - prepare
      - publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install kustomize
        uses: imranismail/setup-kustomize@v2
        with:
          kustomize-version: "5.6.0"

      - name: Build install manifest
        run: |
          tag="${{ needs.prepare.outputs.tag }}"

          cd install
          kustomize edit set image \
            example.com/controller=ghcr.io/1outres/juneau/controller:"$tag"
          kustomize edit set image \
            example.com/webhookcertjob=ghcr.io/1outres/juneau/webhookcertjob:"$tag"
          kustomize edit set image \
            daemon=ghcr.io/1outres/juneau/daemon:"$tag"
          kustomize edit set image \
            bgp-speaker=ghcr.io/1outres/juneau/bgp-speaker:"$tag"
          kustomize build . > "$RUNNER_TEMP/install.yaml"

      - name: Attach manifest to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ needs.prepare.outputs.tag }}"
          gh release view "$tag" >/dev/null 2>&1 \
            || gh release create "$tag" --generate-notes --title "$tag"
          gh release upload "$tag" \
            "$RUNNER_TEMP/install.yaml" \
            --clobber
