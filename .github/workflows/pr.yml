name: PR Checks

on:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache local Go tools and envtest assets
        uses: actions/cache@v4
        with:
          path: |
            bin
            controller/bin
            ~/.cache/golangci-lint
          key: ${{ runner.os }}-tools-${{ hashFiles('Makefile', 'controller/Makefile', '.golangci.yml', 'go.work.sum', 'controller/go.sum', 'daemon/go.sum', 'bgp-speaker/go.sum', 'test/e2e/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-tools-

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.work
          cache: true
          cache-dependency-path: |
            go.work.sum
            controller/go.sum
            daemon/go.sum
            bgp-speaker/go.sum
            test/e2e/go.sum

      - name: Run lint
        run: make lint

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache local Go tools and envtest assets
        uses: actions/cache@v4
        with:
          path: |
            bin
            controller/bin
            ~/.cache/golangci-lint
          key: ${{ runner.os }}-tools-${{ hashFiles('Makefile', 'controller/Makefile', '.golangci.yml', 'go.work.sum', 'controller/go.sum', 'daemon/go.sum', 'bgp-speaker/go.sum', 'test/e2e/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-tools-

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.work
          cache: true
          cache-dependency-path: |
            go.work.sum
            controller/go.sum
            daemon/go.sum
            bgp-speaker/go.sum
            test/e2e/go.sum

      - name: Run tests
        run: make test

  vpn-kernel:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.work
          cache: true
          cache-dependency-path: |
            go.work.sum
            daemon/go.sum

      - name: Install BPF build tools
        run: |
          sudo -n apt-get update
          sudo -n apt-get install -y --no-install-recommends bpftool clang llvm libbpf-dev

      - name: Build BPF objects from source
        run: |
          test -r /sys/kernel/btf/vmlinux
          bpftool btf dump file /sys/kernel/btf/vmlinux format c > daemon/bpf/vmlinux.h
          tools="$(mktemp -d)"
          trap 'rm -rf "$tools"' EXIT
          ln -s "$(command -v clang)" "$tools/bpf-clang"
          ln -s "$(command -v llvm-strip)" "$tools/bpf-llvm-strip"
          printf '#!/bin/sh\nexec go run github.com/cilium/ebpf/cmd/bpf2go@v0.20.0 "$@"\n' > "$tools/bpf2go"
          chmod +x "$tools/bpf2go"
          cd daemon
          PATH="$tools:$PATH" go generate ./internal/daemon/bpf

      - name: Run real-kernel VPN packet tests (no skips)
        run: |
          set -euo pipefail
          sudo -n true
          if ! mountpoint -q /sys/fs/bpf; then
            sudo -n mount -t bpf bpf /sys/fs/bpf
          fi
          cd daemon
          result="$(mktemp)"
          trap 'rm -f "$result"' EXIT
          go test -json -count=1 -exec 'sudo -n' -run '^TestVPN' ./internal/daemon/dataplane/program | tee "$result"
          python3 scripts/check-vpn-kernel-tests.py < "$result"

  images:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build controller image
        uses: docker/build-push-action@v6
        with:
          context: controller
          file: controller/Dockerfile
          push: false
          cache-from: type=gha,scope=controller-image
          cache-to: type=gha,mode=max,scope=controller-image

      - name: Build webhook cert job image
        uses: docker/build-push-action@v6
        with:
          context: controller
          file: controller/Dockerfile.webhookcertjob
          push: false
          cache-from: type=gha,scope=webhookcertjob-image
          cache-to: type=gha,mode=max,scope=webhookcertjob-image

      - name: Build daemon image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: daemon/Dockerfile
          push: false
          cache-from: type=gha,scope=daemon-image
          cache-to: type=gha,mode=max,scope=daemon-image

      - name: Build BGP speaker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: bgp-speaker/Dockerfile
          push: false
          cache-from: type=gha,scope=bgp-speaker-image
          cache-to: type=gha,mode=max,scope=bgp-speaker-image
