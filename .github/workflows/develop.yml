name: Develop Checks

on:
  push:
    branches:
      - develop

permissions:
  contents: read

concurrency:
  group: develop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache local Go tools and envtest assets
        uses: actions/cache@v4
        with:
          path: |
            bin
            controller/bin
            ~/.cache/golangci-lint
          key: ${{ runner.os }}-tools-${{ hashFiles('Makefile', 'controller/Makefile', '.golangci.yml', 'go.work.sum', 'controller/go.sum', 'daemon/go.sum', 'bgp-speaker/go.sum', 'test/e2e/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-tools-

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.work
          cache: true
          cache-dependency-path: |
            go.work.sum
            controller/go.sum
            daemon/go.sum
            bgp-speaker/go.sum
            test/e2e/go.sum

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Run lint
        run: make lint

      - name: Run tests
        run: make test

      - name: Build controller image
        uses: docker/build-push-action@v6
        with:
          context: controller
          file: controller/Dockerfile
          push: false
          cache-from: type=gha,scope=controller-image
          cache-to: type=gha,mode=max,scope=controller-image

      - name: Build webhook cert job image
        uses: docker/build-push-action@v6
        with:
          context: controller
          file: controller/Dockerfile.webhookcertjob
          push: false
          cache-from: type=gha,scope=webhookcertjob-image
          cache-to: type=gha,mode=max,scope=webhookcertjob-image

      - name: Build daemon image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: daemon/Dockerfile
          push: false
          cache-from: type=gha,scope=daemon-image
          cache-to: type=gha,mode=max,scope=daemon-image

      - name: Build BGP speaker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: bgp-speaker/Dockerfile
          push: false
          cache-from: type=gha,scope=bgp-speaker-image
          cache-to: type=gha,mode=max,scope=bgp-speaker-image

  e2e:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache local Go tools and envtest assets
        uses: actions/cache@v4
        with:
          path: |
            bin
            controller/bin
            ~/.cache/golangci-lint
          key: ${{ runner.os }}-tools-${{ hashFiles('Makefile', 'controller/Makefile', '.golangci.yml', 'go.work.sum', 'controller/go.sum', 'daemon/go.sum', 'bgp-speaker/go.sum', 'test/e2e/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-tools-

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.work
          cache: true
          cache-dependency-path: |
            go.work.sum
            controller/go.sum
            daemon/go.sum
            bgp-speaker/go.sum
            test/e2e/go.sum

      - name: Install kind
        uses: engineerd/setup-kind@ecfad61750951586a9ef973db567df1d28671bdc # v0.6.2
        with:
          version: v0.29.0

      - name: Install kubectl
        uses: azure/setup-kubectl@v4

      - name: Run repository E2E
        run: make e2e
