# Stub CRD for the KubeVirt VirtualMachine kind. A lease with
# spec.retainWhile is only read for existence, so the E2E cluster needs the
# kind to be served, not KubeVirt itself. The schema is therefore open: no
# field of a VirtualMachine is ever looked at.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: virtualmachines.kubevirt.io
spec:
  group: kubevirt.io
  names:
    kind: VirtualMachine
    listKind: VirtualMachineList
    plural: virtualmachines
    singular: virtualmachine
  scope: Namespaced
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          x-kubernetes-preserve-unknown-fields: true
